# Project information
site_name: 'Cyber Playbook'
site_description: 'Playbooks are used by cybersecurity professionals to store or encapsulate knowledge on cybersecurity topics and tactics.'
site_author: 'Hush1e'
site_url: 'https://hush1e.github.io/Cyber-Playbook/'

# Repository
repo_name: 'Hush1e/Cyber-Playbook'
repo_url: 'https://github.com/Hush1e/Cyber-Playbook'

# Configuration
theme:
  name: material
  custom_dir: overrides
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.share
    - content.tabs.link
    - content.code.copy
  icon:
    admonition:
      cite: octicons/link-external-16
  logo: static/images/logo.png
  favicon: static/images/favicon.png

# Copyright
copyright: 'Copyright &copy; 2024-2025 Hush1e<br>This work is licensed under a Creative Commons Attribution-ShareAlike 4.0 International License.'

